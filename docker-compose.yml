services:
    db:
        image: postgres:16-alpine
        container_name: wms_postgres_db
        environment:
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
            POSTGRES_DB: ${DB_NAME:-outgoing_orders}
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d outgoing_orders']
            interval: 5s
            timeout: 5s
            retries: 5

    app:
        build: .
        container_name: wms_express_api
        ports:
            - '3000:3000'
        environment:
            PORT: 3000
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
            DATABASE_URL: postgresql://postgres:secretpassword@db:5432/outgoing_orders?sslmode=disable
            PGHOST: db
            PGPORT: 5432
            PGUSER: postgres
            PGPASSWORD: secretpassword
            PGDATABASE: outgoing_orders
        depends_on:
            db:
                condition: service_healthy

volumes:
    postgres_data:
